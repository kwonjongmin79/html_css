<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container
        {
            min-height: 100vh;
            background: yellowgreen;
        }
        .box
        {
            width: 150px;
            height: 150px;
            background: #58f8a0;
            
        }
        .box:hover
        {
            animation: 2s identifier;
            animation-direction: 2s; /* 애니메이션의 방향을 지정 */
            animation-name: identifier; /* 애니메이션의 이름을 지정 */
            animation-timing-function: ease-in-out; /* 처음과 끝이 느리게 변화 */
            animation-iteration-count: 3;       /* 반복횟수 */
            animation-iteration-count: infinite; /* 무한 반복 */
            animation-fill-mode: forwards; /* 애니메이션이 진행되지 않게 */
            animation-fill-mode: backwards; /* 애니메이션이 원래대로 진행되게 */

        }
        /* animation을 진행하면 @keyframes로 동작을 만들어야 한다. */
        @keyframes identifier
        {
            0%
            { /* 시작 */
        
            }
            
            50%
            { /* 중간 */
               border-radius: 1000px; /* 각진 모양 */
               
            }

            100%
            { /* 끝 */
                scale: 1.5; /* 크기를 1.5배 확대 */
                /*transform: translate(150px, -150px); /* x축으로 50px, y축으로 50px 이동 */
                rotate: 90deg; /* 90도 회전 */
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>


    </div>
</body>
</html>
