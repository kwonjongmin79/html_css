<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>셀렉터</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .header p{
            /* 셀렉터 사이에 띄어쓰기 하면 .header 안에 있는 모든 p 태그에 적용 */
            color: rgb(0, 17, 255);

        }
        .box > p
        /* 셀렉터 사이에 > 를 쓰면 .box 바로 밑에 있는 p */
        { 
            color: rgb(0, 255, 0);
            
        }
        h3 ~ p{
            /* h3 태그에 적용 */
            color: rgb(255, 0, 0);
            
            /* 셀렉터 사이에 ~ 을 쓰면 H3 옆(다음)에 있는 모든 P 대상 적용 */
        }
        
        h3 + p{
            /* 셀렉터 사이에 + 을 쓰면 H3 바로 옆(다음)에 있는 P 대상 적용 */
            color: rgb(0, 0, 255) !important;
        }
        /* !important는 겹치는 경우 우선적으로 적용 */
        </style>
</head>
<body>
    <div class="header">
        <h2>제목</h2>
        <div>
        <p>본문글1</p>
        <p>본문글2</p>
        </div>

    </div>
    <div class="box">
        <h2>소제목</h2>
        <div>
            <p>내용1</p>
        </div>
        <p>내용2</p>

    </div>
    <div class="content">
        <h3>소제목</h3>
        <p>본문글1</p>
        <p>본문글2</p>
        <p>본문글3</p>

    </div>

</body>
</html>
